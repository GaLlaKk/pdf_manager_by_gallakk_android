name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, tests et vérification du manifeste
        run: ./gradlew lintDebug testDebugUnitTest verifyNoInternetPermission
      - name: Build debug
        run: ./gradlew assembleDebug
